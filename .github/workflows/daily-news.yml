name: Daily AI News to Telegram
on:
  schedule:
    - cron: '0 2 * * *' # မြန်မာစံတော်ချိန် မနက် ၈:၃၀ တိုင်း အလိုအလျောက် ပို့မည်
  workflow_dispatch: # ကိုယ်တိုင် manual နှိပ်ပြီး စမ်းသပ်ရန်

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python ai_news_to_telegram_free.py
