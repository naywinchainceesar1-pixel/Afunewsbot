name: Daily News Bot

on:
  schedule:
    - cron: '30 2 * * *' # နေ့စဉ် မြန်မာစံတော်ချိန် မနက် ၉ နာရီခွဲမှာ အလိုအလျောက် ပို့ပေးပါမယ်
  workflow_dispatch:      # ကိုယ်တိုင် manually run စမ်းကြည့်လို့ရအောင်ပါ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Telegram Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_news_to_telegram_free.py
