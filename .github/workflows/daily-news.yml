import os
import requests

def send_news():
    # GitHub Secrets ကနေ အချက်အလက်ယူတာပါ
    token = os.getenv('TELEGRAM_BOT_TOKEN')
    chat_id = os.getenv('TELEGRAM_CHAT_ID')
    
    # စာသား (မြန်မာလို)
    message = "🇲🇲 မင်္ဂလာပါ! မြန်မာစံတော်ချိန် မနက် ၈:၃၀ တိုင်း သတင်းပို့ပေးမယ့် စနစ် အဆင်သင့်ဖြစ်ပါပြီ။"
    
    url = f"https://api.telegram.org/bot{token}/sendMessage"
    payload = {"chat_id": chat_id, "text": message}
    
    response = requests.post(url, data=payload)
    print(response.json()) # ဘာမှားလဲဆိုတာ သိရအောင် log ထုတ်ခိုင်းတာပါ

if __name__ == "__main__":
    send_news()
